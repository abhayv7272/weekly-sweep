name: Weekly Sweep Report

on:
  schedule:
    # GitHub cron is ALWAYS UTC and has no DST, and India has no DST either.
    # Scheduled runs are often started late (hours) under GitHub load, and
    # sometimes skipped. So we schedule the report at three times on Saturday:
    #   14:17 UTC = 19:47 IST  (primary)
    #   16:17 UTC = 21:47 IST  (backup)
    #   18:17 UTC = 23:47 IST  (backup)
    # The "Skip if already sent" step makes sure only the FIRST successful run
    # of the week emails; the later backups see it and exit without sending.
    # Minutes are deliberately not :00 — the top of the hour is the most
    # congested time for GitHub's scheduler.
    - cron: "17 14 * * 6"
    - cron: "17 16 * * 6"
    - cron: "17 18 * * 6"
  workflow_dispatch:
    inputs:
      limit:
        description: "Screen only the first N symbols (0 = full universe). Use 40 for a quick test."
        required: false
        default: "0"
      send_email:
        description: "Send the email?"
        type: boolean
        required: false
        default: true

concurrency:
  group: weekly-sweep
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # needed by the "Skip if already sent" step to list runs

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # Scheduled backups must not send a second email. A scheduled run is
      # skipped if a run of this workflow already SUCCEEDED in the last 12 hours
      # (e.g. the 19:47 IST run, or a manual run earlier the same day).
      # Manual runs (workflow_dispatch) always go ahead.
      - name: Skip if already sent
        id: dedupe
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Manual run: always sends."
            exit 0
          fi
          since=$(date -u -d '-12 hours' +%Y-%m-%dT%H:%M:%SZ)
          count=$(gh run list --workflow weekly-sweep.yml --limit 30 \
                    --json databaseId,createdAt,conclusion \
                    --jq "[.[] | select(.conclusion == \"success\") | select(.databaseId != ($CURRENT_RUN | tonumber)) | select(.createdAt >= \"$since\")] | length")
          echo "Successful runs since $since (excluding this one): $count"
          if [ "$count" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "A report already went out in the last 12 hours — skipping this run."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.dedupe.outputs.skip != 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.dedupe.outputs.skip != 'true'
        run: |
          python -m pip install -q -U pip
          pip install -q -r requirements.txt

      # The cache is what turns a 7-minute download into a 5-second re-screen.
      # restore-keys lets a new run start from last week's cache and only
      # top up the missing bars.
      - name: Restore market-data cache
        if: steps.dedupe.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: cache_nse
          key: nse-cache-${{ github.run_id }}
          restore-keys: |
            nse-cache-

      - name: Run screener and email the report
        if: steps.dedupe.outputs.skip != 'true'
        env:
          TZ: Asia/Kolkata
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          MY_APP_PASSWORD: ${{ secrets.MY_APP_PASSWORD }}
          # optional: only set this if you want the report to go somewhere else
          REPORT_TO: ${{ secrets.REPORT_TO }}
          MPLBACKEND: Agg
          PYTHONUNBUFFERED: "1"
        run: |
          ARGS=""
          if [ "${{ inputs.limit }}" != "" ] && [ "${{ inputs.limit }}" != "0" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          if [ "${{ inputs.send_email }}" = "false" ]; then
            ARGS="$ARGS --no-email"
          fi
          echo "run_sweep.py $ARGS"
          python run_sweep.py $ARGS

      - name: Save market-data cache
        if: always() && steps.dedupe.outputs.skip != 'true'
        uses: actions/cache/save@v4
        with:
          path: cache_nse
          key: nse-cache-${{ github.run_id }}

      - name: Upload report artifacts
        if: always() && steps.dedupe.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-sweep-report
          path: |
            out/*.html
            out/*.csv
            out/*.xlsx
            out/*.json
          retention-days: 60
          if-no-files-found: warn
